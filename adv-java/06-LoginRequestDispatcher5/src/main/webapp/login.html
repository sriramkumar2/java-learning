<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login Page</title>
</head>
<body>
	<h2>User Login</h2>
	<form action="LoginServlet" method="post">
	
	<label>Email:</label>
	<input type="email" name="email" required>
	<br></br>
	
	<label>Password:</label>
	<input type="password" name="password" required>
	<br></br>
	
	<button type="submit">Submit</button>
	</form>
</body>
</html>
